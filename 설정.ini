; HWP to PDF 설정 파일
; 값을 바꾼 뒤 저장하고 "HWP to PDF 실행.bat"을 실행하면 다음 실행부터 적용됩니다.

[settings]
; 저장 위치: 출력폴더 / 원본옆
;   출력폴더 - "PDF 출력" 폴더에 저장합니다 (권장). 입력의 하위 폴더 구조를 그대로 따릅니다.
;   원본옆   - 각 한글 문서와 같은 폴더에 같은 이름의 PDF 로 저장합니다.
;              같은 이름의 PDF 가 이미 있고 이 도구가 만든 것이 아니면 덮어쓰지 않고 건너뜁니다.
저장_위치 = 출력폴더

; 한컴 미리보기 대조: 켬 / 끔
;   켬 - 한컴오피스가 문서에 넣어 둔 1쪽 미리보기 그림과 변환 결과 1쪽을 맞대 보고,
;        모양이 많이 다르면 "확인 권장" 으로 알립니다. 문서당 0.3초 남짓 더 듭니다.
미리보기_대조 = 켬
