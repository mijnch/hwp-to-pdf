name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    # 이 도구는 Windows 전용이므로 실제 대상 플랫폼·버전에서 검증한다.
    runs-on: windows-latest

    # pwsh(PowerShell 7)는 스크립트를 UTF-8로 읽는다. Windows PowerShell 5.1이나
    # cmd 는 한글이 든 파일 이름을 깨뜨리므로 여기서는 쓰지 않는다.
    defaults:
      run:
        shell: pwsh

    env:
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 판 고정 패키지 설치
        # pypdf·pdfminer 는 검증 전용이다 — 다른 추출기로도 글자층을 교차 확인한다.
        run: |
          python -m pip install --quiet -r engine/requirements.txt
          python -m pip install --quiet pypdf pdfminer.six

      - name: 단위 검증 78개
        # rhwp 없이 설정·표식·대상 정하기·건너뛰기·암호·글자층 보정·미리보기 대조를 확인한다.
        run: python "engine/단위_검증.py"

      - name: 한국어 명조 글꼴 준비
        # GitHub 의 Windows 러너에는 맑은 고딕·굴림은 있지만 바탕(Batang)이 없어, rhwp 가 본문(명조 계열)을
        # 빈칸으로 그린다(글자층 0%). rhwp 의 명조 대체 목록에서 바탕 다음인 나눔명조(OFL)를 커밋 고정
        # 주소에서 받아 지문을 대조한 뒤 시스템 글꼴 폴더에 둔다. 사용자 PC 에는 바탕이 있어 필요 없다.
        run: |
          $base = "https://raw.githubusercontent.com/google/fonts/bd8f81ddb5c74d5c8897b36ad88b440266245103/ofl/nanummyeongjo"
          $want = @{
            "NanumMyeongjo-Regular.ttf" = "7ed9e8653a8ed04285d51dc343ffea6eb3d9c73afc27383ea8929ee4ffd03205"
            "NanumMyeongjo-Bold.ttf"    = "bc9ed8e60d93fe6db054b8fb988481b625f2eef8cb2317ad0e9834681b8fe3f3"
          }
          foreach ($f in $want.Keys) {
            $out = Join-Path $env:RUNNER_TEMP $f
            Invoke-WebRequest "$base/$f" -OutFile $out
            if ((Get-FileHash $out -Algorithm SHA256).Hash.ToLower() -ne $want[$f]) { throw "지문 불일치: $f" }
            Copy-Item $out "$env:WINDIR\Fonts\$f" -Force
            New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts" `
              -Name ($f -replace '\.ttf$', ' (TrueType)') -Value $f -Force | Out-Null
          }
          Get-ChildItem "$env:WINDIR\Fonts" | Where-Object { $_.Name -match '^(malgun|batang|gulim|Nanum)' } |
            ForEach-Object { Write-Host $_.Name }

      - name: 변환 엔진 rhwp 받기 (지문 대조)
        run: python -c "import sys; sys.path.insert(0, 'engine'); import setup_env; sys.exit(0 if setup_env.fetch_rhwp() else 1)"

      - name: 종단 검증 31항목 (교차 추출기 포함)
        # 합성 문서만 쓴다 — 로그에 실제 문서의 조각이 남지 않는다.
        run: python "engine/종단_검증.py"

      - name: 엔진 구문 검사
        run: python -m compileall -q engine/hwp2pdf.py engine/rhwp_cli.py engine/pdf_text.py engine/fidelity.py engine/setup_env.py engine/build_rhwp.py engine/원본_대조.py
